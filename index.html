<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Fábrica de Prisma da Sudeco</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/9dd9d649b8.js" crossorigin="anonymous"></script>
    <script src="./service.js" defer></script>
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="./assets/favicon/site.webmanifest">
</head>

<body>
    <header>
        <img src="./assets/logo/logoColored.png" height="27px" alt="">
        Fábrica de Prisma
    </header>
    <div class="container mt-3">
        <form>
            <div class="mb-3 mt-2">
                <label class="form-label fw-bold" for="sudeco"><i class="fa-solid fa-calendar-days"></i> Evento</label>
                <div>
                    <input type="radio" name="evento" id="sudecoP" value="sudecoP" onchange="trocaImagem()" checked>
                    <label class="form-label" for="sudecoP"><i class="fa-solid fa-location-dot"></i> Sudeco Pequeno</label>
                    &nbsp;
                    <input type="radio" name="evento" id="sudeco" value="sudeco" onchange="trocaImagem()" >
                    <label class="form-label" for="sudeco"><i class="fa-solid fa-location-dot"></i> Sudeco</label>
                    &nbsp;
                    <input type="radio" name="evento" id="condel" value="condel" onchange="trocaImagem()">
                    <label class="form-label" for="condel"><i class="fa-solid fa-location-dot"></i> Condel</label>
                    &nbsp;
                    <input type="radio" name="evento" id="coaride" value="coaride" onchange="trocaImagem()">
                    <label class="form-label" for="coaride"><i class="fa-solid fa-location-dot"></i> Coaride</label>
                    &nbsp;
                    <input type="radio" name="evento" id="criff" value="criff" onchange="trocaImagem()">
                    <label class="form-label" for="criff"><i class="fa-solid fa-location-dot"></i> Criff</label>
                </div>
            </div>
            <div class="mb-3" id="divReuniao">
                <label for="reuniao" class="form-label fw-bold"><i class="fa-solid fa-building"></i> Nome da
                    Reunião</label>
                <input type="text" class="form-control" autocomplete="off" id="reuniao" name="reuniao"
                    oninput="montaPrisma()">
            </div>
            <div class="mb-3">
                <label for="name" class="form-label fw-bold"><i class="fa-solid fa-user-tie"></i> Nome do Participante</label>
                <input type="text" class="form-control" autocomplete="off" maxlength="65" id="name" name="name" oninput="montaPrisma()">
            </div>
            <div class="mb-3">
                <label for="cargo" class="form-label fw-bold"><i class="fa-solid fa-id-card"></i>
                    Cargo</label>
                <input type="text" class="form-control" autocomplete="off" id="cargo" name="cargo"
                    oninput="montaPrisma()">
            </div>
            <div class="mb-3">
                <label for="organ" class="form-label fw-bold"><i class="fa-solid fa-building-user"></i>
                    Órgão</label>
                <input type="text" class="form-control" autocomplete="off" id="organ" name="organ"
                    oninput="montaPrisma()">
            </div>

            <button class="btn btn-primary" type="button" onclick="montaPrisma()"><i class="fa-solid fa-eye"></i>
                Pré-visualizar Prisma</button>
            <button class="btn btn-success" type="button" onclick="generatePrisma()"><i
                    class="fa-solid fa-file-pdf"></i>
                Exportar Prisma</button>
            <button class="btn btn-warning" type="button" onclick="printPrisma()"><i class="fa-solid fa-print"></i>
                Imprimir Prisma</button>
        </form>
        <hr>
        <div id="a4Content" class="a4-page">
            <p id="organ1"></p>
            <p id="cargo1"></p>
            <p id="name1"></p>
            <p id="reuniao1"></p>
            <div id="space-center"></div>
            <p id="reuniao2"></p>
            <p id="name2"></p>
            <p id="cargo2"></p>
            <p id="organ2"></p>
        </div>
        <footer>
            Feito por Natan Silva - Ascom/Sudeco
        </footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
